[project]
name = "comfyui-yue2-arranger"
description = "Longer, more varied, vocal-free YuE2 songs: one node that plans, mixes, locks key/tempo, renders and retries until the song is varied enough, plus the separate steps, a variety report and seamless loops."
version = "0.2.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.urls]
Repository = "https://github.com/yarharhar/comfyui-yue2-arranger"

[tool.comfy]
PublisherId = ""
DisplayName = "YuE2 Arranger"
Icon = ""

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
